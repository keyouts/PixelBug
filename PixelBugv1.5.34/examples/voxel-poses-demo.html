  const jump = keys.Space || keys.ArrowUp || keys.KeyW || gamepad.jump;
  if (gamepad.interact && !gamepadInteractPressed) advanceDialogue();
  gamepadInteractPressed = gamepad.interact;
  if (gameFinished) { actor.vx = 0; actor.vy = 0; draw(); requestAnimationFrame(step); return; }
  const physics = CORE.physics(pm);
  actor.vx = dialogueActive ? 0 : right && !left ? physics.moveSpeed : left && !right ? -physics.moveSpeed : 0;
  if (actor.vx) actor.facing = actor.vx > 0 ? 1 : -1;
  if (jump && actor.grounded && !dialogueActive) { actor.vy = -physics.jumpSpeed; actor.grounded = false; }
  actor.vy = CORE.advanceVelocity(actor.vy, physics.gravity, seconds);
  actor.grounded = false;
  actor.x = Math.max(0, Math.min(worldWidth() - w, CORE.advanceAxis(actor.x, actor.vx, seconds)));
  let box = actorRect();
  const portal = now >= transitionCooldownUntil ? props.find(prop => prop?.targetSceneId && rectsOverlap(box, propRect(prop))) : null;
  if (portal && loadRuntimeScene(portal.targetSceneId, true, { x:portal.targetX, y:portal.targetY })) { requestAnimationFrame(step); return; }
  solidRuntimeProps().forEach(prop => { const r = propRect(prop); if (!rectsOverlap(box, r)) return; if (actor.vx > 0) actor.x = r.x - w; if (actor.vx < 0) actor.x = r.x + r.w; actor.vx = 0; box = actorRect(); });
  actor.y = CORE.advanceAxis(actor.y, actor.vy, seconds);
  box = actorRect();
  solidRuntimeProps().forEach(prop => { const r = propRect(prop); if (!rectsOverlap(box, r)) return; if (actor.vy > 0) { actor.y = r.y - h; actor.grounded = true; } if (actor.vy < 0) actor.y = r.y + r.h; actor.vy = 0; box = actorRect(); });
  if (actor.y + h >= groundY()) { actor.y = groundY() - h; actor.vy = 0; actor.grounded = true; }
  updateCamera(seconds, true);
  tick++;
  syncNodeTriggers();
  draw();
  requestAnimationFrame(step);
}
canvas.addEventListener("pointerdown", unlockRuntimeAudio);
window.addEventListener("keydown", event => { unlockRuntimeAudio(); if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space"].includes(event.code)) event.preventDefault(); if (event.code === "KeyR") { event.preventDefault(); resetActorToCheckpoint(); return; } if (gameFinished) { if (event.code === "KeyE" || event.code === "Enter") event.preventDefault(); return; } if (event.code === "KeyE" || event.code === "Enter") { event.preventDefault(); advanceDialogue(); return; } keys[event.code] = true; });
window.addEventListener("keyup", event => { keys[event.code] = false; });
window.addEventListener("pagehide", () => stopRuntimeAudio("all"), { once:true });
loadImages().then(() => { if (runtimeScenes.length) loadRuntimeScene(currentSceneId, false); else startSceneAudio(); const h = actorMetrics().h; actor.y = groundY() - h; canvas.focus(); runNodeEvent("sceneStart", { sceneId:currentSceneId }); requestAnimationFrame(step); });
</script>
